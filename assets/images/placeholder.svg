<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Imagen pendiente de reemplazo</title>
  <desc id="desc">Textura abstracta en tonos crema, terracota y carbón para la demo de la peluquería.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="0.58" stop-color="#62483b"/>
      <stop offset="1" stop-color="#d6b69b"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="22%" r="72%">
      <stop offset="0" stop-color="#f7e9dc" stop-opacity=".82"/>
      <stop offset="1" stop-color="#f7e9dc" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="920" cy="160" r="300" fill="url(#glow)" filter="url(#blur)"/>
  <path d="M-80 740C180 470 270 500 470 670s380 220 810-160v390H-80z" fill="#f5f1ee" opacity=".18"/>
  <path d="M130 860C310 580 450 580 620 720s320 150 530-70" fill="none" stroke="#e8cdb9" stroke-width="9" opacity=".55"/>
  <g fill="#fff" opacity=".86" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="600" y="425" font-size="34" letter-spacing="7">ZHEYMAR</text>
    <text x="600" y="470" font-size="16" letter-spacing="4" opacity=".75">IMAGEN DE DEMO</text>
  </g>
</svg>
